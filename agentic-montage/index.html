<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agentic Montage</title>
<meta name="description" content="A real-time simulation of an agent-based media-montage system reading a corpus of declassified documents.">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="plates"></div>
  <div id="vign"></div>
  <div id="scrim"></div>

  <div class="cols">
    <div class="col"><div class="inner"></div></div>
    <div class="col"><div class="inner"></div></div>
    <div class="col"><div class="inner"></div></div>
    <div class="col"><div class="inner"></div></div>
  </div>

  <div class="rule v r1"></div>
  <div class="rule v r2"></div>
  <div class="rule v r3"></div>
  <div class="rule h"></div>
  <div id="mark">AGENTIC MONTAGE</div>
  <div class="tc tc1">00:00:00.00<small>CORPUS</small></div>
  <div class="tc tc2">00:00:00.00<small>INFERENCE</small></div>
  <div class="tc tc3">00:00:00.00<small>SPEECH</small></div>
  <div id="hint"><span class="keys">space pause &middot; c chrome &middot; f fullscreen</span><span class="touch">tap to pause</span></div>

  <div id="locator">
    <div id="globe">
      <svg id="map" viewBox="0 0 360 142" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path id="grat"></path>
        <path id="equator"></path>
        <path id="land"></path>
        <line id="hop" x1="0" y1="0" x2="0" y2="0"></line>
        <g id="pin">
          <line class="ret" x1="-400" y1="0" x2="400" y2="0"></line>
          <line class="ret" x1="0" y1="-200" x2="0" y2="200"></line>
          <circle class="halo" cx="0" cy="0" r="5.5"></circle>
          <circle class="dot" cx="0" cy="0" r="1.4"></circle>
        </g>
      </svg>
      <div id="wfamily">&nbsp;</div>
    </div>
    <div id="where">
      <hr>
      <span id="wplace">&mdash;</span>
      <span id="wregion">&nbsp;</span>
      <span id="wcoord">&nbsp;</span>
      <span id="wdate">&nbsp;</span>
    </div>
  </div>

  <div id="caption"><div id="sub"></div></div>

  <div id="scan"></div>
  <div id="paused">paused</div>

  <div id="bar">
    <div class="led"><i class="up" id="l0"></i>gate array</div>
    <div id="release">USA-UAP Department of War Release 2026</div>
    <div id="docid">&mdash;</div>
  </div>
</div>

<div id="gate" class="gone">
  <h1>AGENTIC MONTAGE</h1>
  <p>click to begin</p>
</div>

<script src="world.js"></script>
<script src="corpus.js"></script>
<script src="index.js"></script>
</body>
</html>
